AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ally spend alerts — API Gateway → Lambda → DynamoDB → SNS → SQS → Lambda

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Architectures:
      - arm64

Resources:

  # API
  SpendAlertsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # Lambdas
  EvaluateTransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/lambdas/evaluateTransaction/
      Events:
        TransactionWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref SpendAlertsApi
            Path: /webhook
            Method: POST
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !Ref TransactionsTable
          SPENDING_RULES_TABLE: !Ref SpendingRulesTable
          SNS_TOPIC_ARN: !Ref AlertsTopic
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpendingRulesTable
        - DynamoDBWritePolicy:
            TableName: !Ref TransactionsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.ts

  ProcessAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/lambdas/processAlert/
      Events:
        AlertQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt AlertsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          ALERTS_TABLE: !Ref AlertsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AlertsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.ts

  GetAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/lambdas/getAlerts/
      Events:
        GetAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref SpendAlertsApi
            Path: /alerts
            Method: GET
      Environment:
        Variables:
          ALERTS_TABLE: !Ref AlertsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.ts

  # DynamoDB
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdTimestampIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SpendingRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpendingRules
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: ruleId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: ruleId
          KeyType: RANGE

  # SNS
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpendAlerts

  # SQS
  AlertsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpendAlertsQueue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AlertsDLQ.Arn
        maxReceiveCount: 3

  AlertsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpendAlertsDLQ

  AlertsQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref AlertsTopic
      Endpoint: !GetAtt AlertsQueue.Arn

  AlertsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AlertsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AlertsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref AlertsTopic


Outputs:
  AlertsTableName:
    Value: !Ref AlertsTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
  SpendingRulesTableName:
    Value: !Ref SpendingRulesTable
  WebhookEndpoint:
    Description: POST transaction webhooks here
    Value: !Sub https://${SpendAlertsApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook
  AlertsEndpoint:
    Description: GET /alerts?userId=...
    Value: !Sub https://${SpendAlertsApi}.execute-api.${AWS::Region}.amazonaws.com/prod/alerts
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  AlertsQueueUrl:
    Value: !Ref AlertsQueue
  AlertsDLQUrl:
    Value: !Ref AlertsDLQ
