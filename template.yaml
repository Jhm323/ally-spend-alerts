AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ally spend alerts — API Gateway → Lambda → DynamoDB → SNS → SQS → Lambda

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Architectures:
      - arm64
    Environment:
      Variables:
        RULES_TABLE: !Ref SpendingRulesTable
        ALERTS_TOPIC_ARN: !Ref AlertsTopic

Resources:

  # ── API ──────────────────────────────────────────────────────────────────

  SpendAlertsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  # ── Lambdas ───────────────────────────────────────────────────────────────

  EvaluateTransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/lambdas/evaluateTransaction/
      Events:
        TransactionWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref SpendAlertsApi
            Path: /webhook
            Method: POST
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SpendingRulesTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.ts

  ProcessAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/lambdas/processAlert/
      Events:
        AlertQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt AlertsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.ts

  # ── DynamoDB ──────────────────────────────────────────────────────────────

  SpendingRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpendingRules
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ruleId
          AttributeType: S
      KeySchema:
        - AttributeName: ruleId
          KeyType: HASH

  # ── SNS ───────────────────────────────────────────────────────────────────

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpendAlerts

  # ── SQS ───────────────────────────────────────────────────────────────────

  AlertsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpendAlertsQueue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AlertsDLQ.Arn
        maxReceiveCount: 3

  AlertsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpendAlertsDLQ

  AlertsQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref AlertsTopic
      Endpoint: !GetAtt AlertsQueue.Arn

  AlertsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AlertsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AlertsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref AlertsTopic

Outputs:
  WebhookEndpoint:
    Description: POST transaction webhooks here
    Value: !Sub https://${SpendAlertsApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  AlertsQueueUrl:
    Value: !Ref AlertsQueue
  AlertsDLQUrl:
    Value: !Ref AlertsDLQ
